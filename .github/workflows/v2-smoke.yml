name: SENTINEL V2 smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install numpy pandas scikit-learn catboost
      - name: Compile Python scripts
        run: python -m py_compile train.py train_v2.py payments.py tests/test_v2_smoke.py
      - name: Smoke test V2 graph features
        run: python tests/test_v2_smoke.py
